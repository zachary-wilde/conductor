apply plugin: 'com.android.application'

def generatedPayload = layout.buildDirectory.dir('generated/runtimeProbePayload')
def prepareRuntimeProbeAssets = tasks.register('prepareRuntimeProbeAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/runtime-probe-assets.mjs', generatedPayload.get().asFile.absolutePath
    inputs.file new File(rootProject.projectDir.parentFile, 'scripts/runtime-probe-assets.mjs')
    outputs.dir generatedPayload
}

android {
    namespace = 'com.reigen.runtime.probe'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.reigen.runtime.probe'
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0-probe'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot.so', '**/libproot-loader*.so']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            assets.srcDir generatedPayload.map { it.dir('assets') }
            jniLibs.srcDir generatedPayload.map { it.dir('jniLibs') }
        }
    }

    androidResources {
        noCompress += ['tgz']
    }
}


dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

tasks.named('preBuild').configure {
    dependsOn prepareRuntimeProbeAssets
}
